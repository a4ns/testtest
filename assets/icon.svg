<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1b78"/>
      <stop offset="1" stop-color="#070a1f"/>
    </linearGradient>
    <radialGradient id="g1" cx=".25" cy=".2" r=".75">
      <stop offset="0" stop-color="#00c2ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".85" cy=".9" r=".7">
      <stop offset="0" stop-color="#ff2bd1" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff2bd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#e4bdfb"/>
      <stop offset=".5" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#7a36a3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
