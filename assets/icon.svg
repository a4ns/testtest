    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>
    <g id="cell">
      <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#tile)"/>
      <rect x="14" y="11" width="72" height="37" rx="16" fill="url(#sheen)"/>
      <rect x="6.5" y="6.5" width="87" height="87" rx="22.5" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
      <circle cx="30" cy="27" r="7" fill="#fff" fill-opacity=".85"/>
